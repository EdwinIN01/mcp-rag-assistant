name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all modules
        run: python -m compileall -q api rag_engine mcp_server evaluation experiments.py

  eval-gate:
    name: RAGAS 评估门禁
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 缓存 HuggingFace 模型（BGE embedding / reranker），避免每次 CI 重新下载
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-v1
      - name: Check secrets availability
        id: secrets
        run: |
          if [ -n "${{ secrets.LLM_API_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::LLM_API_KEY secret 未配置，跳过评估门禁（fork PR 或未配置密钥时正常）"
          fi
      - name: Run RAGAS evaluation gate
        if: steps.secrets.outputs.available == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen-plus' }}
          HF_ENDPOINT: https://hf-mirror.com # 镜像加速模型下载
        run: python -m evaluation --report-dir data/eval
      - name: Upload evaluation reports
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: data/eval/
          retention-days: 30